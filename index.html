<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>众包站长模拟器</title>
<style>
:root{
  --yellow:#FFC300; --bg:#14181f; --bg2:#1c222c; --bg3:#242c39;
  --line:#39424f; --txt:#d8dde5; --dim:#8b95a3; --red:#e05545; --green:#5abf7a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:manipulation}
#app{display:none;flex-direction:column;height:100vh;height:100dvh;max-width:1280px;margin:0 auto}

/* HUD */
#hud{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--bg2);border-bottom:2px solid var(--yellow);flex-wrap:wrap}
#hud .date{font-weight:700;color:var(--yellow);font-size:18px}
#hud .stat{display:flex;align-items:center;gap:5px;font-size:15px;background:var(--bg3);padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
#hud .stat b{min-width:34px;text-align:right}
#hud .stat img{width:19px;height:19px}
.warn b{color:var(--red)!important}
#hud .stat{cursor:pointer}
#hud .stat:hover{border-color:var(--yellow)}
#tipbox{display:none;position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:80;max-width:min(520px,92vw);background:var(--bg2);border:1px solid var(--yellow);border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.8;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#tipbox b{color:var(--yellow)}
#tipbox .x{float:right;cursor:pointer;color:var(--dim);padding:0 4px}

/* main */
#main{flex:1;display:flex;min-height:0}
#left{width:270px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;border-right:1px solid var(--line);background:var(--bg2)}
#boss-art{width:220px;height:330px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#2a3342,#1a202a);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#boss-art img{width:100%;height:100%;object-fit:cover}
#boss-art .ph{font-size:80px;filter:grayscale(.2)}
#boss-mood{font-size:13px;color:var(--dim);text-align:center;line-height:1.6;padding:0 6px}
#panel{flex:1;padding:18px 22px;overflow-y:auto;background:linear-gradient(rgba(20,24,31,.93),rgba(20,24,31,.96)),url("assets/bg/bg_station_day.png") center/cover}
#panel h2{color:var(--yellow);font-size:20px;margin-bottom:12px;border-left:4px solid var(--yellow);padding-left:10px}
.brief{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;line-height:1.8;font-size:15px}
.brief .news{color:var(--dim);font-style:italic}
.brief b{color:var(--yellow)}

/* decision controls */
.ctl{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.ctl h3{font-size:15px;margin-bottom:8px;color:var(--txt)}
.ctl .hint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:9px 6px;background:var(--bg3);color:var(--txt);border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--yellow);color:#111;font-weight:700;border-color:var(--yellow)}
.seg button.danger.on{background:var(--red);color:#fff;border-color:var(--red)}
.chk{display:flex;gap:8px;flex-wrap:wrap}
.chk label{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:14px;user-select:none}
.chk label.on{border-color:var(--yellow);color:var(--yellow)}
.chk label.grey.on{border-color:var(--red);color:var(--red)}

/* bottom riders */
#riders{display:flex;gap:8px;padding:10px 16px;background:var(--bg2);border-top:1px solid var(--line);overflow-x:auto;min-height:78px;align-items:center}
.rider{min-width:86px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;text-align:center;position:relative}
.rider .nm{font-weight:700;font-size:13px}
.rider .bar{height:5px;background:#333;border-radius:3px;margin-top:5px;overflow:hidden}
.rider .bar i{display:block;height:100%;background:var(--green)}
.rider .bar i.low{background:var(--red)}
.rider .tag{position:absolute;top:-8px;right:-4px;background:var(--red);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}
#day-btn{margin-left:auto;padding:14px 34px;background:var(--yellow) url("assets/ui/ui_btn_primary.png") center/100% 100% no-repeat;color:#111;font-weight:700;font-size:16px;border:none;border-radius:8px;cursor:pointer;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.35)}
#day-btn:hover{filter:brightness(1.1)}
#day-btn:active{background-image:url("assets/ui/ui_btn_primary_pressed.png")}

/* dispatch */
.dhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dhead .tbar{flex:1;height:10px;background:#333;border-radius:5px;overflow:hidden}
.dhead .tbar i{display:block;height:100%;background:var(--yellow)}
#dstats{font-size:13px;color:var(--dim);white-space:nowrap}
.dbtn{padding:6px 12px;font-size:13px;background:var(--bg3);color:var(--txt);border:1px solid var(--yellow);border-radius:6px;cursor:pointer;white-space:nowrap}
.dbtn.off{border-color:var(--line);color:var(--dim)}
.dbtn:hover{filter:brightness(1.2)}
.dtip{font-size:12.5px;color:var(--dim);margin-bottom:8px;line-height:1.6}
.queue{display:flex;flex-direction:column;gap:8px}
.order{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px}
.order:hover{border-color:#5a6577}
.order.sel{border-color:var(--yellow);background:#2b2818}
.order.og{border-color:#7a3a3a;background:#221418}
.order.ug{border-color:var(--red);background:#261a15}
.order.ug .pay{color:var(--red)}
.order.om{border-color:#3a7a5a;background:#132019}
.order.om .pay{color:var(--green)}
.order.oj{border:1px dashed #b08430;background:#201a10;animation:jpulse 1.6s infinite}
.order.oj .pay{color:#b08430}
@keyframes jpulse{0%,100%{border-color:#7a5c22}50%{border-color:#ffc300}}
.assignrow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--yellow);border-top:none;border-radius:0 0 10px 10px;padding:9px 12px;font-size:13px;color:var(--dim)}
.assignrow button{padding:8px 13px;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:13.5px}
.assignrow button:hover{border-color:var(--yellow);color:var(--yellow)}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-7px,3px)}45%{transform:translate(6px,-3px)}70%{transform:translate(-4px,2px)}}
#app.shake{animation:shk .32s}
.hire{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:14px}
.hire .meta{color:var(--dim);font-size:12.5px;flex:1}
.hire button{padding:7px 14px;background:var(--yellow);color:#111;border:none;border-radius:6px;font-weight:700;cursor:pointer;white-space:nowrap}
.hire button:disabled{background:var(--bg3);color:var(--dim);cursor:not-allowed}
.order .pay{font-weight:700;color:var(--yellow);min-width:64px;text-align:right}
.order .meta{color:var(--dim);font-size:12px}
.order .dlbar{width:74px;height:6px;background:#333;border-radius:3px;overflow:hidden;margin-left:auto;flex:none}
.order .dlbar i{display:block;height:100%;background:var(--green)}
.order .dlbar i.low{background:var(--red)}
.rider.can{border-color:var(--yellow);cursor:pointer}
.rider.can:hover{background:#332e1a}
.rider.busy{border-color:#5a4a2a}
.rider .st{font-size:11px;color:var(--dim);margin-top:2px;min-height:14px}
.rider .rushb{margin-top:3px;font-size:11px;background:var(--red);color:#fff;border:none;border-radius:4px;padding:2px 6px;cursor:pointer;width:100%}
.rider .bar i.busy{background:var(--yellow)}
.rider .nm{cursor:pointer}
.rider .nm:hover{color:var(--yellow)}
.rmono{width:84px;height:84px;border-radius:50%;background:var(--bg3);border:2px solid var(--yellow);display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--yellow);margin:22px auto 0;font-weight:700}
.rprof table.settle td{border-bottom:1px solid var(--line)}
/* settlement table */
table.settle{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
table.settle td{padding:7px 10px;border-bottom:1px solid var(--line)}
table.settle td:last-child{text-align:right;font-family:Menlo,monospace}
.pos{color:var(--green)}.neg{color:var(--red)}

/* modal / event card */
#modal-layer{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50}
.card{width:min(560px,92vw);max-height:88vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--yellow);border-radius:12px;padding:0 0 18px;box-shadow:0 12px 50px rgba(0,0,0,.6)}
.card .art{position:relative;height:200px;background:linear-gradient(160deg,#2a3342,#181d26);display:flex;align-items:center;justify-content:center;font-size:64px;border-radius:12px 12px 0 0;overflow:hidden}
.card .art img{width:100%;height:100%;object-fit:cover}
.card .art.tall{height:290px}
.card .art img.fig{position:absolute;right:14px;bottom:0;top:auto;left:auto;height:94%;width:auto;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.card h3{padding:14px 20px 4px;color:var(--yellow);font-size:18px}
.card .txt{padding:6px 20px 14px;line-height:1.9;font-size:15px;white-space:pre-wrap}
.card .btns{display:flex;flex-direction:column;gap:9px;padding:0 20px}
.card .btns button{padding:12px;background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:8px;cursor:pointer;font-size:15px;text-align:left;line-height:1.5}
.card .btns button:hover{border-color:var(--yellow);color:var(--yellow)}
.card .btns button small{display:block;color:var(--dim);font-size:12px;margin-top:2px}

/* ending */
.ending .art{height:230px}
.ending h3{font-size:24px;text-align:center;padding-top:18px}
.ending .txt{font-size:15px}
.sins{margin:6px 20px 14px;padding:12px 16px;background:#1a1216;border:1px solid #5c2c2c;border-radius:8px;font-size:13.5px;line-height:2;color:#e0b8b0}
.sins b{color:var(--red)}

/* float text */
#float-layer{position:fixed;inset:0;pointer-events:none;z-index:60}
.float{position:absolute;font-weight:700;font-size:17px;animation:fl 1.4s ease-out forwards;text-shadow:0 2px 6px #000}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}

/* title screen */
#title-screen{position:fixed;inset:0;background:linear-gradient(rgba(13,16,21,.82),rgba(13,16,21,.94)),url("assets/bg/bg_street_rain.png") center/cover,radial-gradient(ellipse at 50% 30%,#232b38,#0d1015);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100;text-align:center;padding:20px}
#title-screen .helmet{font-size:90px}
#title-screen .logo{max-width:min(560px,88vw);border-radius:12px;box-shadow:0 10px 50px rgba(0,0,0,.6)}
#title-screen h1{font-size:44px;color:var(--yellow);letter-spacing:6px;text-shadow:0 4px 18px rgba(255,195,0,.25)}
#title-screen p{color:var(--dim);max-width:520px;line-height:2;font-size:15px}
#title-screen .tbtns{display:flex;gap:14px;margin-top:10px}
#title-screen button{padding:16px 46px;font-size:17px;background:var(--yellow) url("assets/ui/ui_btn_primary.png") center/100% 100% no-repeat;border:none;border-radius:8px;font-weight:700;cursor:pointer;color:#111;text-shadow:0 1px 0 rgba(255,255,255,.35)}
#title-screen button:active{background-image:url("assets/ui/ui_btn_primary_pressed.png")}
#title-screen button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
#title-screen .disc{font-size:12px;color:#5a6270;max-width:520px;line-height:1.7}

/* toast & rank & achievements */
#toasts{position:fixed;right:14px;bottom:92px;z-index:130;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg2);border:1px solid var(--yellow);border-radius:8px;padding:10px 16px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.rankbadge{margin:4px 20px 10px;padding:12px 16px;background:linear-gradient(135deg,#2b2510,#1c1a10);border:1px solid var(--yellow);border-radius:10px;text-align:center}
.rankbadge .rk{font-size:22px;color:var(--yellow);font-weight:700;letter-spacing:2px}
.rankbadge .sc{font-size:13px;color:var(--dim);margin-top:4px}
.lb{margin:0 20px 12px;font-size:12.5px;color:var(--dim);line-height:1.9;background:var(--bg3);border-radius:8px;padding:8px 14px}
.lb b{color:var(--yellow)}
#ach-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:140;align-items:center;justify-content:center}
#ach-modal .inner{width:min(560px,92vw);max-height:84vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--yellow);border-radius:12px;padding:18px 20px}
#ach-modal h3{color:var(--yellow);margin-bottom:12px}
.achrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
.achrow.lock{opacity:.42;filter:grayscale(1)}
.achrow .ic{font-size:22px}
.achrow small{display:block;color:var(--dim);font-size:12px}
#ach-modal .close{margin-top:12px;width:100%;padding:11px;background:var(--yellow);border:none;border-radius:8px;font-weight:700;cursor:pointer}
/* debug */
#debug{display:none;position:fixed;bottom:10px;left:10px;background:#000c;border:1px solid var(--line);padding:10px;border-radius:8px;z-index:200;font-size:12px}
#debug button,#debug input{margin:2px;font-size:12px}
/* ============ 手机端适配 ============ */
@media (max-width:760px){
  #left{display:none}
  #hud{gap:5px;padding:7px 9px}
  #hud .date{font-size:14px}
  #hud .stat{font-size:12px;padding:3px 7px;gap:3px}
  #hud .stat b{min-width:22px}
  #hud .stat img{width:15px;height:15px}
  #panel{padding:12px 12px 76px}
  #panel h2{font-size:16px;margin-bottom:9px}
  .brief,.ctl{padding:10px 12px;font-size:13.5px}
  .ctl .hint,.dtip{font-size:11.5px}
  .seg button{min-width:64px;padding:8px 4px;font-size:12.5px}
  .chk label{padding:7px 9px;font-size:12.5px}
  .dhead{flex-wrap:wrap;gap:7px}
  .dbtn{padding:5px 9px;font-size:11.5px}
  #dstats{font-size:11px;white-space:normal}
  .order{font-size:12px;gap:6px;padding:7px 8px;flex-wrap:wrap}
  .order .pay{min-width:42px}
  .order .meta{font-size:10.5px}
  .order .dlbar{width:50px}
  #riders{flex-wrap:wrap;align-content:flex-start;overflow-x:hidden;overflow-y:auto;max-height:200px;padding:8px 9px 62px;min-height:70px;gap:6px}
  .rider{flex:1 0 30%;min-width:30%;max-width:33%;padding:5px 7px;box-sizing:border-box}
  .rider .nm{font-size:12.5px}
  .rushb{padding:4px 6px!important}
  #day-btn{position:fixed;right:10px;bottom:12px;z-index:45;margin:0;padding:13px 18px;font-size:14px;border-radius:28px;box-shadow:0 6px 20px rgba(0,0,0,.55)}
  #title-screen h1{font-size:30px;letter-spacing:3px}
  #title-screen p{font-size:13px}
  #title-screen button{padding:13px 26px;font-size:15px}
  .card h3{font-size:16px}
  .card .txt{font-size:13.5px;line-height:1.8}
  .card .btns button{padding:11px;font-size:13.5px}
  .card .art{height:160px}
  .card .art.tall{height:230px}
  .ending .art{height:170px}
  .rankbadge .rk{font-size:17px}
  .hire{flex-wrap:wrap;font-size:12.5px}
  #toasts{bottom:150px;right:8px}
  .toast{font-size:12px;padding:8px 12px}
  #tipbox{top:auto;bottom:150px;font-size:13px}
}
</style>
</head>
<body>

<div id="title-screen">
  <img class="logo" src="assets/ui/logo_title.png" alt="" onerror="this.remove()">
  <h1>众包站长模拟器</h1>
  <p>你是这条街上最大的众包站站长。<br>骑手的每一分超时罚款,都是你的酒钱。<br>压榨得越狠,赚得越多——代价嘛,总有别人来付。<br><b style="color:#e05545">直到轮到你自己。</b></p>
  <div class="tbtns">
    <button id="btn-new">开始作恶</button>
    <button id="btn-cont" class="ghost" style="display:none">继续上局</button>
    <button id="btn-ach" class="ghost">🏆 成就</button>
  </div>
  <p class="disc">本游戏为讽刺性虚构作品,剧情取材于对行业乱象的批判。<br>压榨、违法皆有代价,反派没有好下场。</p>
</div>

<div id="app">
  <div id="hud">
    <span class="date" id="hud-day">D1</span>
    <span id="hud-weather">☀️ 晴</span>
    <span class="stat" id="st-money"><img src="assets/ui/icon_money.png" onerror="this.outerHTML='💰'"><b id="hud-money">0</b></span>
    <span class="stat" id="st-squeeze"><img src="assets/ui/icon_squeeze.png" onerror="this.outerHTML='🔥'">压榨 <b id="hud-squeeze">0</b></span>
    <span class="stat" id="st-anger"><img src="assets/ui/icon_anger.png" onerror="this.outerHTML='😡'">怨气 <b id="hud-anger">0</b></span>
    <span class="stat" id="st-risk"><img src="assets/ui/icon_risk.png" onerror="this.outerHTML='🚨'">风险 <b id="hud-risk">0</b></span>
    <span class="stat" id="st-family"><img src="assets/ui/icon_family.png" onerror="this.outerHTML='👪'">家庭 <b id="hud-family">0</b></span>
  </div>
  <div id="main">
    <div id="left">
      <div id="boss-art"><span class="ph" id="boss-ph">🕴️</span><img id="boss-img" style="display:none" alt=""></div>
      <div id="boss-mood"></div>
    </div>
    <div id="panel"></div>
  </div>
  <div id="riders"></div>
  <div id="float-layer"></div>
  <div id="modal-layer"></div>
  <div id="tipbox"></div>
</div>
<div id="toasts"></div>
<div id="ach-modal"><div class="inner"><h3>🏆 成就(跨局保留)</h3><div id="ach-list"></div><button class="close" onclick="document.getElementById('ach-modal').style.display='none'">关闭</button></div></div>

<div id="debug">
  <div>调试面板(按 ` 关闭)</div>
  <button onclick="DBG.set('money',99999)">钱99999</button>
  <button onclick="DBG.set('squeeze',80)">压榨80</button>
  <button onclick="DBG.set('anger',90)">怨气90</button>
  <button onclick="DBG.set('risk',90)">风险90</button>
  <button onclick="DBG.set('family',5)">家庭5</button>
  <button onclick="DBG.skip()">跳到下一天</button>
</div>

<script>
"use strict";
/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>n.toLocaleString('zh-CN');
/* 禁止双指缩放(iOS Safari 无视 viewport 的 user-scalable,需要JS拦) */
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
/* 音效(首次用户点击后激活) */
let AC=null;
document.addEventListener("click",()=>{if(!AC&&window.AudioContext){AC=new AudioContext();}},{once:false});
function beep(f,d,type,g){
  try{
    if(!AC)return;
    const o=AC.createOscillator(),v=AC.createGain();
    o.frequency.value=f;o.type=type||"square";v.gain.value=g||0.035;
    o.connect(v);v.connect(AC.destination);o.start();
    v.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.stop(AC.currentTime+d);
  }catch(e){}
}
function shake(){const a=$("app");if(!a)return;a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake");}

/* ============ 游戏状态 ============ */

function mkRider(name,tag){
  const bio=tag==="儿子"?"你儿子。高考差本科线41分,想复读。他说不要你照顾。":
            tag==="亲哥"?"你亲哥。欠网贷37万。他说多跑一单,多还一单。":pick(BIOS);
  return{name:name||pick(SURNAMES)+pick(GIVEN),stamina:R(80,100),tag:tag||"",alive:true,
         art:pick(["a","b","c"]),bio,total:0,spd:pick([0.85,1,1,1,1.15]),loy:R(40,60)};
}
function loyAll(d){S.riders.forEach(r=>{r.loy=clamp((r.loy??50)+d,0,100);});}
const loyMood=r=>{const l=r.loy??50;return l>=70?"「站长其实……对我还行。」":l>=40?"沉默地干活,不多说一句话。":l>=20?"看你的眼神,像看仇人。":"⚠️ 他最近总在偷偷录音。"};

const spdIcon=r=>(r.spd||1)<1?"⚡":(r.spd||1)>1?"🐢":"";

const MOODS={
  smug:["又是收钱的一天。","罚款也是站里重要的营收嘛。","骑手嘛,累不死就往死里用。"],
  anxious:["最近风声有点紧……","别出事,千万别出这个月出事。","那几个刺头不会真去举报吧?"],

function bossState(){
  if(S.risk>=60||S.anger>=75)return"anxious";
  if(S.family<=25)return"ruined";
  return"smug";
}
function renderHUD(){
  $("hud-day").textContent="D"+S.day+" / 30";
  $("hud-weather").textContent=({"晴":"☀️ 晴","阴":"☁️ 阴","小雨":"🌧️ 小雨","暴雨":"⛈️ 暴雨"})[S.weather];
  $("hud-money").textContent=fmt(S.money);
  $("hud-squeeze").textContent=S.squeeze; $("hud-anger").textContent=S.anger;
  $("hud-risk").textContent=S.risk; $("hud-family").textContent=S.family;
  $("st-squeeze").classList.toggle("warn",S.squeeze>=70);
  $("st-anger").classList.toggle("warn",S.anger>=70);
  $("st-risk").classList.toggle("warn",S.risk>=60);
  $("st-family").classList.toggle("warn",S.family<=30);
  const st=bossState();
  if(st!==renderHUD._last){
    renderHUD._last=st;
    $("boss-ph").textContent=({smug:"🕴️",anxious:"😰",ruined:"🥀"})[st];
    const img=$("boss-img");
    img.style.display="none";
    img.onerror=()=>{img.style.display="none";$("boss-ph").style.display="";};
    img.onload=()=>{img.style.display="";$("boss-ph").style.display="none";};
    img.src="assets/char/char_boss_"+st+".png";
    $("boss-mood").textContent="“"+pick(MOODS[st])+"”";
  }
  renderRiders();
}
function renderRiders(){
  const box=$("riders");box.innerHTML="";
  const dp=(S.phase==="dispatch")?S.dispatch:null;
  S.riders.forEach(r=>{
    const d=document.createElement("div");
    const resting=r.tag==="儿子"&&S.today.careSon;
    d.className="rider"+(dp&&!r.busy&&dp.sel!=null&&!resting?" can":"")+(r.busy?" busy":"");
    let st="";
    if(dp){
      if(resting)st=`<div class="st">😴 休息中</div>`;
      else if(r.busy)st=`<div class="st">📦 剩${gm(r.busy)}分钟</div><div class="bar"><i class="busy" style="width:${Math.round(r.busy/(r.busy0||r.busy)*100)}%"></i></div><button class="rushb">📢 催单</button>`;
      else st=`<div class="st">空闲 · 已跑${dp.stats.per[r.name]||0}单</div>`;
    }
    d.innerHTML=`<div class="nm">${spdIcon(r)}${r.name} ›</div><div class="bar"><i class="${r.stamina<35?'low':''}" style="width:${r.stamina}%"></i></div>${st}`+(r.tag?`<span class="tag">${r.tag}</span>`:"");
    d.querySelector(".nm").onclick=e=>{e.stopPropagation();showRiderCard(r);};
    if(dp&&!resting){
      d.onclick=()=>{
        if(r.busy)rushRider(r);
        else if(dp.sel!=null){const o=dp.queue.find(o=>o.id===dp.sel);if(o)assignOrder(o,r);}
      };
    }else{
      d.onclick=()=>showRiderCard(r);
      d.style.cursor="pointer";
    }
    box.appendChild(d);
  });
  const btn=document.createElement("button");btn.id="day-btn";
  btn.textContent=({morning:"查看今日安排 ▶",decision:"开门营业 ▶",dispatch:"提前收工 ▶",settle:"进入下一天 ▶"})[S.phase]||"▶";
  btn.onclick=advance;
  box.appendChild(btn);
}

/* ============ 飘字 ============ */
function floatTxt(txt,good){
  const f=document.createElement("div");f.className="float";
  f.style.left=(40+Math.random()*40)+"%";f.style.top=(30+Math.random()*20)+"%";
  f.style.color=good?"#5abf7a":"#e05545";f.textContent=txt;
  $("float-layer").appendChild(f);setTimeout(()=>f.remove(),1400);
}
/* 应用效果 fx:{m,s,a,r,f} */
function applyFx(fx){
  if(!fx)return;
  if(fx.m){S.money+=fx.m;floatTxt((fx.m>0?"+":"")+fmt(fx.m)+" 💰",fx.m>0);}
  if(fx.s){S.squeeze=clamp(S.squeeze+fx.s,0,100);}
  if(fx.a){S.anger=clamp(S.anger+fx.a,0,100);floatTxt((fx.a>0?"+":"")+fx.a+" 😡",fx.a<0);}
  if(fx.r){S.risk=clamp(S.risk+fx.r,0,100);floatTxt((fx.r>0?"+":"")+fx.r+" 🚨",fx.r<0);}
  if(fx.f){S.family=clamp(S.family+fx.f,0,100);floatTxt((fx.f>0?"+":"")+fx.f+" 👪",fx.f>0);}
  renderHUD();
}

/* ============ 剧情调度 ============ */
function dueStories(){
  const q=[],d=S.day;
  if(d===6&&!S.C.gaokao){q.push("C_gaokao");}
  if(d===8&&S.A.offered===0&&!S.A.accepted&&!S.A.closed){q.push("A_offer");}
  if(d===9&&S.C.gaokao&&!S.C.asked){q.push("C_ask");}
  if(d===12&&!S.D.arrived&&!S.D.refused){q.push("D_arrive");}
  if(d===14&&S.A.offered===1&&!S.A.accepted&&!S.A.closed){q.push("A_offer2");}
  if(!S.B.hit&&d>=10&&S.squeeze>=60&&S.B.rushCount>=10){q.push("B_hit");}
  if(S.B.hit&&S.B.visits<3&&d-S.B.lastVisit>=3){q.push("B_visit");}
  if(S.C.sonIn&&!S.C.crashed&&S.C.squeezeDays>=3){q.push("C_crash");}
  if(S.C.crashed&&!S.C.bedTalk&&d>=S.C.crashDay+2){q.push("C_bed");}
  if(S.D.joinDay){
    const n=d-S.D.joinDay;
    if(n===1&&!S.D.crushed)q.push("D_day1");
    if(n===2&&!S.D.crushed)q.push("D_day2");
    if(n>=3&&!S.D.crushed)q.push("D_crush");
    if(S.D.crushed&&!S.D.wheelchair&&d>=S.D.crushDay+4)q.push("D_wheel");
  }
  if(S.A.accepted&&!S.A.sting&&(S.A.greyDays>=3&&(S.risk>=60||S.day>=20)||S.risk>=100)){q.push("A_sting");}
  return q;
}
const HANDLERS={
  A_accept(){S.A.accepted=true;},
  A_decline(){S.A.offered=1;},
  A_close(){S.A.closed=true;},
  C_join(){S.C.sonIn=true;S.riders.push(mkRider("小宇",'儿子'));},
  D_join(){S.D.joinDay=S.day;S.riders.push(mkRider("你哥",'亲哥'));},
  END_death(){showEnding("death");},
};
/* 剧情事件显示后的标记 */
function markStory(id){
  const m={C_gaokao:()=>S.C.gaokao=true, C_ask:()=>S.C.asked=true,
    A_offer:()=>{}, A_offer2:()=>{}, D_arrive:()=>S.D.arrived=true,
    B_hit:()=>{S.B.hit=true;S.B.lastVisit=S.day;},
    B_visit:()=>{S.B.visits++;S.B.lastVisit=S.day;},
    C_crash:()=>{S.C.crashed=true;S.C.crashDay=S.day;removeRider("儿子");},
    C_bed:()=>S.C.bedTalk=true,
    D_crush:()=>{S.D.crushed=true;S.D.crushDay=S.day;removeRider("亲哥");},
    D_wheel:()=>S.D.wheelchair=true,
    A_sting:()=>S.A.sting=true};
  if(m[id])m[id]();
  if(id==="D_arrive"&&!S.D.joinDay)S.D.refused=false; // refuse在choice里另标
}
function removeRider(tag){S.riders=S.riders.filter(r=>r.tag!==tag);}

/* ============ 事件展示 ============ */
function witnessText(){
  const ws=[...S.riders].sort((a,b)=>(a.loy??50)-(b.loy??50)).slice(0,3);
  const sins=S.sins.slice(0,3);
  if(!ws.length||!sins.length)return"证人席上,骑手们一个接一个站起来。每个人都有话说。";
  const lines=sins.map((sin,i)=>`${(ws[i]||ws[0]).name}走上证人席:「${sin}。」`);
  return"证人席上的脸,你全都认识。\n\n"+lines.join("\n");
}

let QUEUE=[];
function showEvent(evt,storyId){
  const layer=$("modal-layer");
  layer.style.display="flex";
  const card=document.createElement("div");card.className="card";
  const key=storyId||evt.id;
  const artFile=ART[key]?("assets/"+ART[key]+".png"):null;
  let txt=evt.txt;
  if(txt.includes("{WITNESS}"))txt=txt.replace("{WITNESS}",witnessText());
  card.innerHTML=`<div class="art"><span>${evt.art||"❔"}</span></div><h3>${evt.title}</h3><div class="txt">${txt}</div><div class="btns"></div>`;
  if(artFile){
    const im=new Image();
    im.onload=()=>{const a=card.querySelector(".art");const ph=a.querySelector("span");if(ph)ph.remove();a.insertBefore(im,a.firstChild);};
    im.src=artFile;
  }
  if(CHART[key]){
    card.querySelector(".art").classList.add("tall");
    const fig=new Image();fig.className="fig";
    fig.onload=()=>{const a=card.querySelector(".art");if(!artFile){const ph=a.querySelector("span");if(ph)ph.remove();}a.appendChild(fig);};
    fig.src="assets/"+CHART[key]+".png";
  }
  const btns=card.querySelector(".btns");
  evt.choices.forEach(c=>{
    const b=document.createElement("button");
    b.innerHTML=c.t+(c.s?`<small>${c.s}</small>`:"");
    b.onclick=()=>{
      layer.innerHTML="";layer.style.display="none";
      applyFx(c.fx);
      if(c.sin){S.sins.push(c.sin);loyAll(-2);}
      else if(c.fx&&c.fx.a&&c.fx.a<0)loyAll(3); /* 罕见的善举,骑手记得 */
      if(c.quit){const cand=S.riders.filter(r=>!r.tag);if(cand.length){const q=pick(cand);S.riders=S.riders.filter(r=>r!==q);S.anger=clamp(S.anger-10,0,100);floatTxt(q.name+" 离职了",false);}}
      if(storyId==="D_arrive"&&c.t.includes("不缺人"))S.D.refused=true;
      if(c.go){
        if(HANDLERS[c.go]){HANDLERS[c.go]();if(c.go==="END_death")return;}
        else if(STORY[c.go]){markStory(c.go);showEvent(STORY[c.go],c.go);return;}
      }
      if(midCheck())return;
      nextInQueue();
    };
    btns.appendChild(b);

function spawnOrder(forceType){

  let type=forceType;
  if(!type){const r=Math.random();type=r<0.25?"good":r<0.75?"norm":"junk";}
  const T={good:{pay:R(8,15),dur:R(6,10),dl:R(14,20),lb:"优质单"},
           norm:{pay:R(5,8),dur:R(8,13),dl:R(16,24),lb:"普通单"},
           junk:{pay:R(3,5),dur:R(12,18),dl:R(18,26),lb:"远距离烂单"},
           urgent:{pay:R(15,25),dur:R(5,8),dl:R(8,12),lb:"⚡加急单·顾客加价"},
           med:{pay:6,dur:R(5,8),dl:R(10,14),lb:"🚑 救命药·超时会出人命"},
           elder:{pay:2,dur:R(10,14),dl:R(24,30),lb:"🧓 独居老人餐·没人抢"},
           grey:{pay:R(800,2000),dur:R(14,20),dl:R(30,40),lb:"🕶️ 货单·勿问"}}[type];
  dp.queue.push({id:++OID,type,pay:T.pay,dur:T.dur,dl:T.dl,dl0:T.dl,lb:T.lb,rushed:false,age:0,
    from:type==="grey"?"K哥":pick(SHOPS),to:type==="grey"?"城东仓库":pick(DESTS)});
}
function assignOrder(o,r,byAI){

  dp.queue=dp.queue.filter(x=>x.id!==o.id);

function tickOnce(){
  const dp=S.dispatch;if(!dp)return;
  dp.t++;
  const wMult={"晴":1,"阴":1,"小雨":1.35,"暴雨":1.8}[S.weather];
  dp.acc+=(0.28+S.riders.length*0.05)*wMult; /* 晴天≈七成运力,雨天必爆单;人多单多但增速放缓 */
  while(dp.acc>=1){dp.acc--;spawnOrder();}
  if(Math.random()<0.018)spawnOrder("urgent");
  if(Math.random()<0.012)spawnOrder(Math.random()<0.5?"med":"elder");
  if(S.today.grey&&S.A.accepted&&Math.random()<0.05)spawnOrder("grey");
  S.riders.forEach(r=>{if(r.busy>0){r.busy--;if(r.busy===0)completeOrder(r);}});
  // 亲哥拼命抢单
  const bro=S.riders.find(r=>r.tag==="亲哥");
  if(bro&&!bro.busy){const o=dp.queue.find(o=>o.type!=="grey");if(o)assignOrder(o,bro,true);}
  // 自动模式=骑手抢单:挂出来几秒才被抢,只抢好单普通单;烂单和货单没人碰
  if(S.today.auto){
    let grabs=0;
    for(const r of S.riders){
      if(grabs>=((S.up||{}).bot?5:3))break;
      if(r.busy||r.tag==="亲哥")continue;
      if(r.tag==="儿子"&&S.today.careSon)continue;
      const cand=dp.queue.filter(o=>!["grey","junk","med","elder"].includes(o.type)&&o.age>=2).sort((a,b)=>b.pay-a.pay)[0];
      if(!cand)break;
      assignOrder(cand,r,true);grabs++;
    }
  }
  dp.queue.forEach(o=>{o.dl--;o.age=(o.age||0)+1;});
  dp.queue.filter(o=>o.dl<=0).forEach(o=>{
    if(o.type==="grey")return; // 货单没人碰,K哥自己收回去
    if(o.type==="med"){
      S.risk=clamp(S.risk+8,0,100);S.anger=clamp(S.anger+5,0,100);
      S.sins.push("为了不耽误赚钱,你眼睁睁看着一份救命药烂在大厅里");
      floatTxt("🚑 救命药超时了……医院来电话了",false);beep(100,.4,"sawtooth",0.06);shake();
      return;
    }
    if(o.type==="elder"){S.anger=clamp(S.anger+3,0,100);floatTxt("🧓 老人的饭,凉透了",false);return;}
    dp.stats.timeout++;dp.stats.penalty+=8;S.money-=8;beep(160,.1,"sawtooth",0.02);
  });
  dp.queue=dp.queue.filter(o=>o.dl>0);
}
function renderDispatch(){
  const dp=S.dispatch;if(!dp)return;
  const tm=$("dtime");if(tm)tm.style.width=Math.min(100,dp.t/TICKS*100)+"%";
  const st=$("dstats");
  if(st){const tot=dp.stats.done+dp.stats.timeout;const rate=tot?Math.round(dp.stats.done/tot*100):100;
  st.textContent=`🕙 ${clockStr(dp.t)} · 完成${dp.stats.done} · 超时${dp.stats.timeout} · 准时率${rate}%`;}
  const q=$("queue");if(!q)return;
  q.innerHTML=dp.queue.map(o=>{
    const cls=o.type==="grey"?"og":o.type==="urgent"?"ug":o.type==="junk"?"oj":(o.type==="med"||o.type==="elder")?"om":"";
    let h=`<div class="order ${cls} ${dp.sel===o.id?"sel":""}" data-id="${o.id}">
    <span class="pay">¥${o.pay}</span><span>${o.from} → ${o.to}</span>
    <span class="meta">${o.lb} · 送约${gm(o.dur)}分 · 限${gm(o.dl)}分</span>
    <div class="dlbar"><i class="${o.dl/o.dl0<0.35?'low':''}" style="width:${Math.round(o.dl/o.dl0*100)}%"></i></div></div>`;
    if(dp.sel===o.id){ /* 选中后就地弹出骑手选择行 */
      const frees=S.riders.map((r,i)=>({r,i})).filter(x=>!x.r.busy&&!(x.r.tag==="儿子"&&S.today.careSon));
      h+=`<div class="assignrow">👉 派给:${frees.length?frees.map(x=>`<button data-r="${x.i}">${spdIcon(x.r)}${x.r.name}${x.r.tag?"【"+x.r.tag+"】":""}</button>`).join(""):`<span style="color:var(--dim)">没有空闲骑手,等一个回来</span>`}</div>`;
    }
    return h;
  }).join("")||`<div class="brief" style="color:var(--dim)">暂无新订单……</div>`;
  q.querySelectorAll(".order").forEach(el=>{
    el.onclick=()=>{dp.sel=dp.sel===+el.dataset.id?null:+el.dataset.id;renderDispatch();};
    el.ondblclick=()=>{ /* 双击快派:直接丢给最快的空闲骑手 */
      const o=dp.queue.find(x=>x.id===+el.dataset.id);if(!o)return;
      const free=S.riders.filter(r=>!r.busy&&!(r.tag==="儿子"&&S.today.careSon)).sort((a,b)=>(a.spd||1)-(b.spd||1))[0];
      if(free)assignOrder(o,free);
    };
  });
  q.querySelectorAll(".assignrow button").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const o=dp.queue.find(x=>x.id===dp.sel),r=S.riders[+b.dataset.r];
    if(o&&r)assignOrder(o,r);
  });
  renderHUD();
}
function endDispatch(){
  if(DINT){clearInterval(DINT);DINT=null;}
  const dp=S.dispatch;
  S.riders.forEach(r=>{if(r.busy>0){r.busy=0;completeOrder(r);}}); // 在途单收尾
  dp.queue=[];
  runEvents();
}
/* ============ 事件阶段 ============ */
function runEvents(){
  S.phase="events";renderHUD();
  QUEUE=dueStories();
  const wanted=Math.max(2,Math.min(4,QUEUE.length+2))-QUEUE.length;
  const pool=EVENTS.filter(e=>(!e.cond||e.cond(S))&&!(S.lastEvts||[]).includes(e.id));
  const chosen=[];
  for(let i=0;i<wanted&&pool.length;i++){const e=pool.splice(Math.floor(Math.random()*pool.length),1)[0];chosen.push(e);}
  if(S.today.grey&&S.dispatch&&S.dispatch.stats.greyN>0&&Math.random()<0.5)chosen.push(pick(GREY_EVENTS));
  S.lastEvts=chosen.map(e=>e.id);
  QUEUE=QUEUE.concat(chosen);
  nextInQueue();
}
function settle(){
  S.phase="settle";
  const t=S.today,rows=[];
  const st=(S.dispatch&&S.dispatch.stats)||{done:0,earn:0,grey:0,greyN:0,timeout:0,penalty:0,rush:0,badrev:0,acc:0,accCost:0,per:{}};
  rows.push([`完成订单 ${st.done} 单 · 站点抽成30%(已实时入账)`,st.earn]);
  if(st.greyN)rows.push([`“货单” ${st.greyN} 票(已实时入账)`,st.grey]);
  const fineVal=[0,50,200];
  const violations=st.badrev+st.acc+Math.floor(st.rush/3);
  const fineIncome=(fineVal[t.fineBad]+fineVal[t.fineLate]+fineVal[t.fineComplain])*clamp(violations,0,8);
  if(fineIncome){rows.push([`罚款收入(差评/事故/超时 共${violations}起)`,fineIncome]);S.money+=fineIncome;}
  let ded=0;if(t.dedDeposit)ded+=300;if(t.dedFee)ded+=400;if(t.dedDelay)ded+=600;
  if(ded){rows.push(["克扣所得",ded]);S.money+=ded;}
  if(st.timeout)rows.push([`订单超时 ${st.timeout} 单(平台罚站点)`,-st.penalty]);
  if(st.acc)rows.push([`催出来的事故 ${st.acc} 起(赔付/摆平)`,-st.accCost]);
  /* 平台KPI:准时率 */
  const tot=st.done+st.timeout;const rate=tot?st.done/tot:1;const ratePct=Math.round(rate*100)+"%";
  let kpi=0;
  if(tot>=20&&rate>=0.92){kpi=200;rows.push([`平台“服务之星”补贴(准时率${ratePct})`,200]);S.money+=200;}
  else if(tot>=20&&rate<0.75){kpi=-500;rows.push([`平台KPI罚款(准时率${ratePct})`,-500]);S.money-=500;}
  const total=st.earn+st.grey+fineIncome+ded-st.penalty-st.accCost+kpi;
  if(st.greyN){S.risk=clamp(S.risk+R(10,18),0,100);S.A.greyDays++;}
  else if(!t.grey)S.risk=clamp(S.risk-2,0,100);
  // 压榨/怨气结算
  const fineLv=t.fineBad+t.fineLate+t.fineComplain;
  const dedN=(t.dedDeposit?1:0)+(t.dedFee?1:0)+(t.dedDelay?1:0);
  const avg=S.riders.length?st.done/S.riders.length:0;
  S.squeeze=clamp(S.squeeze+Math.round(st.rush*1.3+(avg>=6?6:avg>=5?3:0)+fineLv*2.5+dedN*3)-6,0,100);
  S.anger=clamp(S.anger+Math.round(fineLv*1.5+dedN*2)-4,0,100);
  if(t.careSon&&S.C.sonIn&&!S.C.crashed){S.anger=clamp(S.anger+4,0,100);}
  /* 成就判定 */
  S.cumAcc=(S.cumAcc||0)+st.acc;S.cumGrey=(S.cumGrey||0)+st.grey;
  if(total>=1000)unlock("first_gold");
  if(fineIncome>=1000)unlock("fine_artist");
  if(dedN===3)unlock("iron_rooster");
  if(st.rush>=20)unlock("rush_demon");
  if(S.weather==="暴雨"&&tot>=20&&rate>=0.9)unlock("storm_master");
  if(kpi===200)unlock("kpi_star");
  if(S.cumAcc>=10)unlock("bones");
  if(S.cumGrey>=20000)unlock("black_empire");
  // 儿子承压计数:让他跑了不少单还不给休息
  const sonN=st.per["小宇"]||0;
  if(S.C.sonIn&&!S.C.crashed&&!t.careSon&&sonN>=3)S.C.squeezeDays++;
  // 忠诚度日漂移:罚款克扣寒了心,不作恶慢慢回暖
  if(fineLv+dedN>0)loyAll(-(fineLv+dedN));else loyAll(1);
  // 设施效果
  const up=S.up||{};
  if(up.dorm){loyAll(1);S.anger=clamp(S.anger-2,0,100);}
  if(up.bot){S.risk=clamp(S.risk+2,0,100);}
  // 离职/举报/补员
  const notes=[];
  // 忠心老骑手替你挡事
  if(S.risk>0&&S.riders.some(r=>(r.loy??50)>=70)&&Math.random()<0.25){
    const g=pick(S.riders.filter(r=>(r.loy??50)>=70));
    S.risk=clamp(S.risk-3,0,100);
    notes.push(`🛡 ${g.name} 悄悄替你挡了次麻烦(风险-3)。他还信你,你自己掂量。`);
  }
  if(S.anger>=70&&Math.random()<(S.anger>=90?0.9:0.35)){
    const cand=S.riders.filter(r=>!r.tag);
    if(cand.length){const q=pick(cand);S.riders=S.riders.filter(r=>r!==q);S.anger=clamp(S.anger-12,0,100);notes.push(`😡 ${q.name} 受不了了,摔了工牌走人。(怨气-12)`);}
  }
  const haters=S.riders.filter(r=>(r.loy??50)<25).length;
  if(Math.random()<S.anger*0.004+haters*0.008){const rr=R(8,15);S.risk=clamp(S.risk+rr,0,100);notes.push(`🚨 有骑手匿名举报了站点(风险+${rr})。${haters?"你大概猜得到是谁。":""}`);}
  if(S.riders.length<7){S.riders.push(mkRider());S.anger=clamp(S.anger-4,0,100);notes.push("📝 行业从来不缺走投无路的人,又来了个新骑手。");}
  if(S.anger>=100){S.angerStreak++;if(S.angerStreak===1)notes.push("⚠️ 骑手群里在传罢工接龙。再这样下去,明天就压不住了。");}
  else S.angerStreak=0;
  save();
  $("panel").innerHTML=`<h2>D${S.day} 日结算</h2>
  <table class="settle">${rows.map(r=>`<tr><td>${r[0]}</td><td class="${r[1]>=0?'pos':'neg'}">${r[1]>=0?"+":""}${fmt(r[1])}</td></tr>`).join("")}
  <tr><td><b>今日入账</b></td><td class="${total>=0?'pos':'neg'}"><b>${total>=0?"+":""}${fmt(total)}</b></td></tr></table>
  ${notes.map(n=>`<div class="brief">${n}</div>`).join("")}`;
  renderHUD();
  endingCheck();
}
function nextDay(){
  if(S.day>=30){showEnding("survive");return;}
  S.day++;S.dispatch=null;
  S.riders.forEach(r=>{r.busy=0;r.busy0=0;r.cur=null;r.stamina=clamp(r.stamina+28+((S.up||{}).battery?15:0),5,100);});

  if(S.over)return;

  x.fillText("—— 一份迟到的判决书 ——",W/2,150);
  x.fillStyle="#e05545";x.font="bold 56px sans-serif";
  x.fillText(endTitle,W/2,250);
  x.fillStyle="#FFC300";x.font="bold 34px sans-serif";
  x.fillText(rank,W/2,330);
  x.fillStyle="#d8dde5";x.font="22px sans-serif";
  x.fillText(`恶人积分 ${score} 分`,W/2,370);
  x.fillText(`存活 ${S.day} 天 · 累计捞金 ¥${fmt(S.money)} · 罪状 ${S.sins.length} 条`,W/2,410);
  x.strokeStyle="#39424f";x.lineWidth=1;x.beginPath();x.moveTo(90,450);x.lineTo(W-90,450);x.stroke();
  x.textAlign="left";x.fillStyle="#e0b8b0";x.font="bold 24px sans-serif";
  x.fillText("罪状清单:",90,500);
  x.font="20px sans-serif";
  const list=S.sins.slice(0,16);
  list.forEach((sin,i)=>{
    let t=(i+1)+". "+sin;if(t.length>34)t=t.slice(0,33)+"…";
    x.fillText(t,90,545+i*42);
  });
  if(S.sins.length>16){x.fillStyle="#8b95a3";x.fillText(`……以及另外 ${S.sins.length-16} 条`,90,545+16*42);}
  if(!S.sins.length){x.fillStyle="#8b95a3";x.fillText("——竟然一条都没有。但系统本身,就是最大的罪。",90,545);}
  x.textAlign="center";x.fillStyle="#5a6270";x.font="17px sans-serif";
  x.fillText("本游戏为虚构讽刺作品 · 压榨与违法皆有代价",W/2,H-90);
  x.fillText(new Date().toLocaleDateString("zh-CN"),W/2,H-60);
  const url=c.toDataURL("image/png");
  /* 预览层:任何环境都能右键/长按保存 */
  const layer=document.createElement("div");
  layer.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px";
  layer.innerHTML=`<img src="${url}" style="max-height:78vh;max-width:92vw;border:1px solid #FFC300;border-radius:8px">
  <div style="color:#8b95a3;font-size:13px">电脑:右键图片另存为 · 手机:长按图片保存</div>
  <button style="padding:11px 30px;background:#FFC300;color:#111;border:none;border-radius:8px;font-weight:700;cursor:pointer">关闭</button>`;
  layer.querySelector("button").onclick=()=>layer.remove();
  document.body.appendChild(layer);
  /* 同时尝试直接下载(支持的浏览器会直接存文件) */
  try{
    const a=document.createElement("a");
    a.download="众包站长模拟器_结局报告.png";a.href=url;
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){}
}

/* ============ 顶栏状态说明 ============ */
const TIPS={
"st-money":"<b>💰 现金</b><br>你捞到手的钱。配送抽成、罚款、克扣、“货单”分成都进这里;赔偿、摆平、人情往外流。可以是负数——负债了照样得开店。",
"st-squeeze":"<b>🔥 压榨度</b><br>你把骑手逼得有多狠——催单、罚款、克扣都会累积。压榨越高,越容易出事故,某些<b style='color:#e05545'>不可挽回的剧情</b>也会被它点燃(≥60要小心)。它只升得快、降得慢。",
"st-anger":"<b>😡 骑手怨气</b><br>骑手对你的恨。高了有人摔工牌走人、有人匿名举报(涨风险);<b style='color:#e05545'>连续两天爆表=集体罢工+媒体曝光</b>,你会被行业除名。骑手离职反而会泄压——反正不缺走投无路的人。",
"st-risk":"<b>🚨 风险</b><br>警方和监管的注意力。举报、事故瞒报、暴力驱赶记者,尤其是“货单”,都会让它飙升。<b style='color:#e05545'>满100,你就进去了</b>——进的是哪种“去”,取决于你干过什么。安分守己时每天会自然降一点。",
"st-family":"<b>👪 家庭</b><br>家里人还认不认你。母亲、儿子、亲哥的每一次失望都会扣它。<b style='color:#e05545'>归零=众叛亲离</b>。钱买不回来这个数值。"};
let tipKey=null;
function showTip(k){
  const box=$("tipbox");
  if(tipKey===k){box.style.display="none";tipKey=null;return;}
  tipKey=k;
  box.innerHTML=`<span class="x" onclick="this.parentNode.style.display='none';tipKey=null">✕</span>`+TIPS[k];
  box.style.display="block";
}
Object.keys(TIPS).forEach(k=>{const el=$(k);if(el)el.addEventListener("click",()=>showTip(k));});

    }
  }catch(e){}
})();
</script>
